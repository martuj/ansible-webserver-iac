---
- hosts: localhost
  become: yes

  tasks:

  - name: Install Apache
    apt:
      name: apache2
      state: present
      update_cache: yes

  - name: Start Apache
    service:
      name: apache2
      state: started
      enabled: yes

  - name: Create User
    user:
      name: opsadmin
      state: present

  - name: Open HTTP Port
    ufw:
      rule: allow
      port: "80"
      proto: tcp

  - name: Deploy Website
    template:
      src: /root/ansible-webserver-iac/templates/index.html.j2
      dest: /var/www/html/index.html
